<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watchtower | Portal monitoring</title>
<style>
:root {
  color-scheme: dark;
  font: 16px system-ui, -apple-system, sans-serif;
  background: #0a0a1a;
  color: #f5efff;
  --muted: #c2b6d8;
  --line: #3a3a63;
  --accent: #c4b5fd;
  --panel: #191939;
  --page-gradient: radial-gradient(ellipse 100% 80% at 50% 30%, rgba(99, 102, 241, 0.25) 0%, transparent 60%),
    radial-gradient(ellipse 80% 60% at 50% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
    linear-gradient(180deg, #0F0F2D 0%, #0A0A1A 100%);
  --heading-gradient: linear-gradient(90deg, #C4B5FD 0%, #A78BFA 50%, #818CF8 100%);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--page-gradient); }
header { background: var(--panel); border-bottom: 1px solid var(--line); }
header > div, main { width: min(100% - 48px, 1200px); margin-inline: auto; }
header > div { min-height: 72px; }
header strong { display: flex; align-items: center; gap: 10px; font-size: 21px; letter-spacing: -.045em; }
.brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: #43345e; color: var(--accent); }
header > div, .row, .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
main { padding-block: 32px 56px; }
.overview {
  padding: clamp(24px, 4vw, 48px);
  background: #19193966;
  border: 1px solid var(--line);
  border-radius: 26px;
  color: #fff;
}
h1 { margin: 0; font-size: clamp(36px, 6vw, 66px); font-weight: 400; letter-spacing: -.06em; line-height: 1.05; }
h1 span { color: #c4b5fd; }
@supports (background-clip: text) {
  h1 span { background: var(--heading-gradient); background-clip: text; color: transparent; }
}
h2, h3 { margin: 0; letter-spacing: -.025em; }
h2 { font-size: 21px; overflow-wrap: anywhere; }
h3 { font-size: 17px; }
small, p { color: var(--muted); }
p { margin: 8px 0 14px; line-height: 1.5; }
.overview > p { color: #dddaef; margin: 12px 0 24px; }
button, input { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; background: var(--panel); }
button { cursor: pointer; font-weight: 600; }
button:hover, button[aria-pressed=true] { border-color: #a99ad1; background: #44345f; }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.primary { background: var(--accent); color: #251b3c; border-color: var(--accent); border-radius: 999px; padding-inline: 17px; }
.primary:hover { background: #dbceff; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.metric { background: #ffffff12; border: 1px solid #ffffff26; border-radius: 14px; padding: 14px 16px; }
.metric small { color: #e1ddf4; }
.metric strong { display: block; margin-top: 3px; font-size: 29px; font-weight: 550; }
.layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 20px; align-items: start; margin-top: 22px; }
.panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: clamp(17px, 3vw, 26px); }
.list { display: grid; gap: 8px; margin-top: 16px; }
.list button { text-align: left; width: 100%; overflow-wrap: anywhere; padding: 12px; }
.list button > small { display: block; font-weight: 400; }
.portal-summary { margin-top: 5px; }
.actions { justify-content: flex-start; flex-wrap: wrap; margin: 14px 0; }
.results-tabs { border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-top: 20px; }
.results-tabs button { border-radius: 999px; }
.danger, #form-error, #remove-error, #action-message, #message { color: #ffb4ca; }
#action-message:empty, #message:empty { display: none; }
.entry { border-top: 1px solid var(--line); padding: 14px 0; overflow-wrap: anywhere; }
.entry:first-child { border-top: 0; }
.pill { font-size: 12px; font-weight: 650; border-radius: 999px; padding: 4px 8px; background: #473763; color: #e1d4ff; white-space: nowrap; }
.serving, .reachable, .ok { color: #a5e6c8; background: #224238; }
.failed, .error { color: #ffb4ca; background: #562d48; }
.healing { color: #ffd999; background: #514029; }
a { color: var(--accent); }
dialog { width: min(440px, 95vw); background: var(--panel); color: inherit; border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
dialog input { display: block; width: 100%; margin: 6px 0 12px; }
dialog::backdrop { background: #120d23a8; }
#portal-url { overflow-wrap: anywhere; }
[hidden] { display: none !important; }
@media (max-width: 740px) {
  header > div, main { width: calc(100% - 32px); }
  main { padding-top: 20px; }
  .layout { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
<header><div><strong><span class="brand-mark" aria-hidden="true">◈</span>Watchtower</strong><button class="primary" id="add">+ Add portal</button></div></header>
<main>
  <section class="overview" aria-labelledby="overview-title">
    <h1 id="overview-title">Portal <span>overview</span></h1>
    <p>Monitor public tender portals and review their latest runs.</p>
    <div class="metrics" id="metrics"></div>
  </section>
  <p id="message" role="status"></p>
  <div class="layout">
    <section class="panel"><div class="heading"><h2>Monitored portals</h2></div><div class="list" id="portals"></div></section>
    <section class="panel" aria-label="Portal details">
      <div id="details"><p>Select a portal to see its details.</p></div>
      <div id="controls" hidden><div class="actions"><button id="check">Check now</button><button id="remove" class="danger">Remove portal</button></div><p id="action-message" role="status"></p><div class="actions results-tabs" role="group" aria-label="Portal results"><button id="tenders" aria-pressed="true">Tenders</button><button id="runs" aria-pressed="false">Run history</button></div><div id="entries"></div></div>
    </section>
  </div>
</main>
<dialog id="dialog">
  <form id="form"><h2>Add portal</h2><p>Enter the public address of a tender portal.</p><label for="url">Portal URL</label><input id="url" required type="text" inputmode="url" autocapitalize="none" spellcheck="false" placeholder="procurement.example"><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" id="submit">Add portal</button></div></form>
</dialog>
<dialog id="remove-dialog" aria-labelledby="remove-title" aria-describedby="remove-description">
  <form id="remove-form">
    <h2 id="remove-title">Remove portal?</h2>
    <p id="remove-description"></p>
    <p id="remove-error" role="alert"></p>
    <div class="actions"><button type="button" id="remove-cancel" autofocus>Cancel</button><button class="danger" id="remove-confirm">Remove portal</button></div>
  </form>
</dialog>
<script>
const $ = id => document.getElementById(id)
const config = new URLSearchParams(location.search)
const api = config.get('api') || location.origin
const finalContract = config.get('contract') === 'patterno'
const labels = {unknown:'Unchecked',ok:'Reachable',error:'Failed',integrating:'Integrating',serving:'Serving',healing:'Healing',failed:'Failed'}
const checking = new Set()
let portals = [], selected = null, tab = 'tenders', detailRequest = 0, removal = null, loading = false, portalRevision = 0
const escape = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])
const date = value => value ? new Date(value).toLocaleString() : '—'
const badge = (state,label) => '<span class="pill '+escape(state)+'">'+escape(label)+'</span>'
async function request(path,options){
  const response = await fetch(new URL(path,api),options)
  if(!response.ok){
    const body = await response.json().catch(()=>null)
    throw new Error(typeof body?.detail==='string' ? body.detail : 'API returned HTTP '+response.status)
  }
  if(response.status===204)return
  return response.json()
}
function normalize(portal){
  const state=portal.state ?? portal.status
  const reason=portal.reason ?? portal.detail ?? ''
  const statusCode=Number(portal.statusCode ?? portal.status_code)
  let accessFailure=''
  if(/\b(?:captcha|required human verification|verify (?:that )?you are human)\b/i.test(reason) && ['failed','error','healing'].includes(state)){
    accessFailure='The portal requires a CAPTCHA or human verification.'
  }else if(statusCode===401 || /\b(?:(?:log[ -]?in|sign[ -]?in|authentication) required|requires? (?:a )?(?:log[ -]?in|sign[ -]?in|authentication)|(?:log|sign) in to (?:continue|access))\b/i.test(reason)){
    accessFailure='The portal requires a login.'
  }else if(statusCode===403){
    accessFailure='The portal denied access (HTTP 403).'
  }
  return {id:portal.id,url:portal.url ?? portal.address,state:accessFailure?'failed':state,
    reason:accessFailure||reason,count:portal.tenderCount ?? portal.tender_count,
    last:portal.lastSuccessAt ?? portal.last_read_at,reachable:portal.reachable}
}
function renderList(){
  const totals = [['Monitored portals',portals.length],['Serving',portals.filter(p=>p.state==='serving').length],['Needs attention',portals.filter(p=>['failed','error','healing'].includes(p.state)).length],['Tenders held',portals.every(p=>p.count!=null)?portals.reduce((sum,p)=>sum+p.count,0):'—']]
  $('metrics').innerHTML=totals.map(([name,value])=>'<div class="metric"><small>'+name+'</small><strong>'+value+'</strong></div>').join('')
  const focus=document.activeElement?.dataset.portal
  $('portals').innerHTML=portals.map(p=>'<button data-portal="'+escape(p.id)+'" aria-pressed="'+(String(p.id)===selected)+'"><span class="row"><strong>'+escape(new URL(p.url).hostname)+'</strong>'+badge(labels[p.state]==='Reachable'?'reachable':p.state,labels[p.state]??p.state)+'</span><small>'+escape(p.url)+'</small><small class="portal-summary">'+escape(p.count??'—')+' tenders · Last successful check '+escape(date(p.last))+'</small></button>').join('')||'<p>No portals yet. Add one to get started.</p>'
  if(focus)Array.from($('portals').querySelectorAll('button')).find(button=>button.dataset.portal===focus)?.focus({preventScroll:true})
}
function runLabel(status){
  return ({ok:'Succeeded',error:'Failed'})[status]??status??'In progress'
}
function runTime(run){
  return run.at ?? run.finishedAt ?? run.startedAt
}
function documentLink(doc){
  try{
    const source=doc.path ?? doc.url ?? doc.downloadPath
    if(!source)return ''
    const url=new URL(source,api)
    if(!['http:','https:'].includes(url.protocol))return ''
    return '<div><a href="'+escape(url.href)+'" download target="_blank" rel="noopener">Download '+escape(doc.fileName??'document')+'</a></div>'
  }catch{return ''}
}
async function renderDetail(){
  const token=++detailRequest
  const p=portals.find(item=>String(item.id)===selected)
  $('controls').hidden=!p
  if(!p){$('details').innerHTML='<p>Select a portal to see its details.</p>';$('entries').innerHTML='';return}
  const reachability=p.reachable==null?'':`<p>Website ${p.reachable?'reachable':'unreachable'}</p>`
  $('details').innerHTML='<h2>'+escape(new URL(p.url).hostname)+'</h2><small id="portal-url">'+escape(p.url)+'</small>'+reachability+'<p>'+escape(p.reason||labels[p.state]||p.state)+'</p><small id="latest-check" hidden></small><small style="display:block">Last successful read · '+date(p.last)+'</small>'+(p.last&&['healing','failed'].includes(p.state)?'<p>Showing tenders from the last verified read.</p>':'')
  $('tenders').setAttribute('aria-pressed',tab==='tenders')
  $('runs').setAttribute('aria-pressed',tab==='runs')
  $('check').disabled=checking.has(selected)||p.state==='integrating'||p.state==='healing'
  $('check').textContent=checking.has(selected)?'Checking…':'Check now'
  const path='/portals/'+encodeURIComponent(p.id)
  const history=request(path+'/runs').then(runs=>[...runs].sort((a,b)=>new Date(runTime(b))-new Date(runTime(a))))
  const latest=history.then(([run])=>{
    if(token!==detailRequest||!run||!runTime(run))return
    const status=run.result??run.status
    const kind=run.kind==='repair'?'repair':'check'
    $('latest-check').textContent=(status==='error'?`Last ${kind} failed`:`Last ${kind}`)+' · '+date(runTime(run))
    $('latest-check').hidden=false
  }).catch(()=>{})
  try{
    const entries=await (tab==='runs'?history:request(path+'/tenders'))
    if(token!==detailRequest)return
    const markup=tab==='runs'
      ? entries.map(r=>'<article class="entry"><div class="row"><strong>'+escape(r.kind==='repair'?'Repair':'Read')+'</strong>'+badge(r.result??r.status??'pending',runLabel(r.result??r.status))+'</div><small>'+date(runTime(r))+'</small>'+(r.detail?'<p>'+escape(r.detail)+'</p>':'')+'</article>').join('') || '<p>No runs recorded yet.</p>'
      : entries.map(t=>'<article class="entry"><h3>'+escape(t.title??'Untitled tender')+'</h3><p>'+escape(t.buyerName??t.reference??'Buyer unavailable')+' · Due '+date(t.submissionDeadline)+'</p>'+(t.documents??[]).map(documentLink).join('')+'</article>').join('') || '<p>No tenders available yet.</p>'
    if($('entries').innerHTML!==markup)$('entries').innerHTML=markup
  }catch(error){if(token===detailRequest)$('entries').textContent='Could not load '+tab+'. '+error.message}
  await latest
}
async function load(){
  if(loading)return
  loading=true
  const revision=portalRevision
  try{
    const results=await request('/portals')
    if(revision!==portalRevision)return
    portals=results.map(normalize)
    if(!portals.some(p=>String(p.id)===selected))selected=portals.length?String(portals[0].id):null
    $('message').textContent=''
    renderList()
    await renderDetail()
  }catch(error){$('message').textContent='Could not reach the portal API. '+error.message}
  finally{loading=false}
}
$('portals').onclick=event=>{
  const button=event.target.closest('[data-portal]')
  if(!button)return
  selected=button.dataset.portal
  $('action-message').textContent=''
  $('entries').textContent='Loading…'
  renderList()
  renderDetail()
}
for(const name of ['tenders','runs'])$(name).onclick=()=>{tab=name;$('entries').textContent='Loading…';renderDetail()}
$('add').onclick=()=>{$('form').reset();$('form-error').textContent='';$('dialog').showModal()}
$('cancel').onclick=()=>$('dialog').close()
$('form').onsubmit=async event=>{
  event.preventDefault()
  $('form-error').textContent=''
  $('submit').disabled=true
  try{
    const address=$('url').value.trim()
    const url=new URL(/^[a-z][a-z\d+.-]*:\/\//i.test(address) ? address : 'https://'+address)
    if(!['https:','http:'].includes(url.protocol)||url.username||url.password)throw new Error('Enter a public HTTP or HTTPS URL.')
    const portal=await request('/portals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[finalContract?'url':'address']:url.href})})
    portalRevision++
    portals=portals.filter(item=>String(item.id)!==String(portal.id))
    portals.push(normalize(portal))
    selected=String(portal.id)
    tab='tenders'
    $('dialog').close()
    $('entries').textContent='Loading…'
    renderList()
    await renderDetail()
  }catch(error){$('form-error').textContent=error.message}
  finally{$('submit').disabled=false}
}
$('check').onclick=async()=>{
  if(!selected||$('check').disabled)return
  const id=selected
  checking.add(id)
  $('action-message').textContent=''
  $('check').disabled=true
  $('check').textContent='Checking…'
  try{
    await request('/portals/'+encodeURIComponent(id)+'/refresh',{method:'POST'})
    await load()
  }catch(error){
    if(selected===id)$('action-message').textContent='Check failed. '+error.message
  }finally{
    checking.delete(id)
    if(selected===id){
      const portal=portals.find(item=>String(item.id)===id)
      $('check').disabled=['integrating','healing'].includes(portal?.state)
      $('check').textContent='Check now'
    }
  }
}
$('remove').onclick=()=>{
  const portal=portals.find(item=>String(item.id)===selected)
  if(!portal)return
  removal=selected
  $('remove-description').textContent='Stop monitoring '+portal.url+' and remove its tender and run history?'
  $('remove-error').textContent=''
  $('remove-dialog').showModal()
}
$('remove-cancel').onclick=()=>$('remove-dialog').close()
$('remove-dialog').oncancel=event=>{
  if($('remove-confirm').disabled)event.preventDefault()
}
$('remove-form').onsubmit=async event=>{
  event.preventDefault()
  if(removal===null||$('remove-confirm').disabled)return
  const id=removal
  $('remove-confirm').disabled=true
  $('remove-cancel').disabled=true
  $('remove-error').textContent=''
  try{
    await request('/portals/'+encodeURIComponent(id),{method:'DELETE'})
    portalRevision++
    portals=portals.filter(portal=>String(portal.id)!==id)
    if(selected===id){
      selected=portals.length?String(portals[0].id):null
      tab='tenders'
      $('entries').textContent=''
      $('action-message').textContent=''
    }
    $('remove-dialog').close()
    renderList()
    await renderDetail()
    if(selected===null)$('add').focus()
    else $('portals').querySelector('[aria-pressed="true"]')?.focus()
  }catch(error){
    $('remove-error').textContent=error.message
  }finally{
    $('remove-confirm').disabled=false
    $('remove-cancel').disabled=false
  }
}
setInterval(load,2500)
load()
</script>
</html>
