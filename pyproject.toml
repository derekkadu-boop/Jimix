[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jimix-watchtower"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "beautifulsoup4>=4.13,<5",
    "certifi>=2025.1.31",
    "httpx>=0.28,<0.29",
    "openai>=2.28,<3",
    "openapi3-parser>=2.0,<3",
    "playwright>=1.51,<2",
    "protego>=0.7,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.26,<2",
]

[tool.setuptools]
packages = ["watchtower", "watchtower.tools"]

[tool.setuptools.package-data]
watchtower = ["phrases.json", "schema.sql"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
