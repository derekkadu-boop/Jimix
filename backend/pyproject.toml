[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jimix-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "certifi>=2025.1.31",
    "fastapi>=0.115.0",
    "geonamescache>=3,<4",
    "httpx>=0.28,<0.29",
    "openai>=2.28,<3",
    "playwright>=1.51,<2",
    "python-dateutil>=2.9,<3",
    "python-dotenv>=1.1,<2",
    "tldextract>=5.3,<6",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.26,<2",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["schema.sql", "keywords.json"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
